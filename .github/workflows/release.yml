name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version; the selected Git ref must be the matching v-prefixed tag.
        required: true
        default: 0.2.0
        type: string
      publish_to_nuget:
        description: Exchange an OIDC token and publish the CLI and build-integration packages to nuget.org.
        required: true
        default: false
        type: boolean
      publish_github_release:
        description: Create the GitHub release with portable binaries and packages.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and requested version
        shell: pwsh
        run: |
          $version = $env:RELEASE_VERSION
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw 'Release version must be a stable major.minor.patch version.'
          }
          if ($env:GITHUB_REF -ne "refs/tags/v$version") {
            throw "Select tag v$version when dispatching this workflow."
          }
          [xml] $project = Get-Content src/dottype/dottype.csproj -Raw
          if ($project.Project.PropertyGroup.Version -ne $version) {
            throw 'Project version must match the release tag.'
          }
          [xml] $buildProject = Get-Content src/dottype.Build/dottype.Build.csproj -Raw
          if ($buildProject.Project.PropertyGroup.Version -ne $version) {
            throw 'Build-package version must match the release tag.'
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch "(?m)^## \[$([regex]::Escape($version))\] - [0-9]{4}-[0-9]{2}-[0-9]{2}\s*$") {
            throw 'Finalize the dated changelog entry before tagging.'
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore dottype.slnx --locked-mode

      - name: Build
        run: dotnet build dottype.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/dottype.tests/dottype.tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Test build integration
        run: dotnet test --project tests/dottype.Build.tests/dottype.Build.tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Pack NuGet tool
        run: dotnet pack src/dottype/dottype.csproj -c Release --no-build --no-restore -p:RuntimeIdentifiers= -o artifacts/package

      - name: Verify NuGet package
        shell: pwsh
        run: ./eng/verify-package.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Pack build integration
        run: dotnet pack src/dottype.Build/dottype.Build.csproj -c Release --no-build --no-restore -o artifacts/package

      - name: Verify build-integration package
        shell: pwsh
        run: ./eng/verify-build-package.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Verify Visual Studio project integration
        shell: pwsh
        run: ./eng/verify-visual-studio.ps1 -ExpectedVersion $env:RELEASE_VERSION

      - name: Publish portable executables
        shell: pwsh
        run: ./eng/publish-portables.ps1 -Version $env:RELEASE_VERSION

      - name: Smoke test x64 portable executable
        shell: pwsh
        run: ./eng/smoke-test.ps1 -Executable artifacts/portable/release/dottype-win-x64.exe

      - name: Create checksums
        shell: pwsh
        run: |
          $releaseDirectory = 'artifacts/portable/release'
          Get-ChildItem -LiteralPath $releaseDirectory -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            } | Set-Content -LiteralPath "$releaseDirectory/SHA256SUMS.txt" -Encoding utf8NoBOM

      - name: Upload release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dottype-${{ inputs.version }}
          path: |
            artifacts/package/*
            artifacts/portable/release/*
          if-no-files-found: error

  smoke-arm64:
    needs: release
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Check out selected ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dottype-${{ inputs.version }}
          path: artifacts
      - name: Smoke test ARM64 portable executable
        shell: pwsh
        run: ./eng/smoke-test.ps1 -Executable artifacts/portable/release/dottype-win-arm64.exe

  publish:
    if: inputs.publish_to_nuget || inputs.publish_github_release
    needs: [release, smoke-arm64]
    runs-on: windows-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dottype-${{ inputs.version }}
          path: artifacts

      - name: Obtain short-lived NuGet credential
        if: inputs.publish_to_nuget
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to nuget.org
        if: inputs.publish_to_nuget
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          foreach ($packageId in @('dottype', 'dottype.Build')) {
            dotnet nuget push "artifacts/package/$packageId.$env:RELEASE_VERSION.nupkg" `
              --api-key $env:NUGET_API_KEY `
              --source https://api.nuget.org/v3/index.json `
              --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $packageId failed." }
          }

      - name: Create GitHub release
        if: inputs.publish_github_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($env:RELEASE_VERSION))\] - [^\r\n]+\r?\n(.*?)(?=^## \[|\z)")
          if (!$section.Success) { throw 'Release notes were not found.' }
          $section.Groups[1].Value.Trim() | Set-Content artifacts/release-notes.md -Encoding utf8NoBOM
          $assets = @(
            Get-ChildItem -LiteralPath artifacts/package -File
            Get-ChildItem -LiteralPath artifacts/portable/release -File
          ) | ForEach-Object FullName
          gh release create "v$env:RELEASE_VERSION" @assets `
            --verify-tag `
            --notes-file artifacts/release-notes.md `
            --title "dottype $env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Creating the GitHub release failed.' }
