name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.400
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore dottype.slnx --locked-mode

      - name: Build
        run: dotnet build dottype.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/dottype.tests/dottype.tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Pack NuGet tool
        if: runner.os == 'Linux'
        run: dotnet pack src/dottype/dottype.csproj -c Release --no-build --no-restore -p:RuntimeIdentifiers= -o artifacts/package

      - name: Verify NuGet package
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/verify-package.ps1

      - name: Smoke test CLI
        shell: pwsh
        run: ./eng/smoke-test.ps1 -Executable dotnet -PrefixArguments @('exec', 'src/dottype/bin/Release/net10.0/dottype.dll')

      - name: Publish Windows portable executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/publish-portables.ps1

      - name: Smoke test portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/smoke-test.ps1 -Executable artifacts/portable/release/dottype-win-x64.exe

      - name: Generate WinGet manifests
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          ./eng/new-winget-manifests.ps1
          -Version 0.1.0
          -X64Installer artifacts/portable/release/dottype-win-x64.exe
          -Arm64Installer artifacts/portable/release/dottype-win-arm64.exe

      - name: Verify WinGet manifests and hashes
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/verify-winget-manifests.ps1

      - name: Validate WinGet manifests when available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget --version
            winget validate --manifest artifacts/winget/manifests/d/DouglasCleghorn/dottype/0.1.0
            if ($LASTEXITCODE -ne 0) { throw "WinGet manifest validation failed." }
          }
          else {
            Write-Host "winget is not available on this runner; generation checks still completed."
          }

      - name: Upload NuGet packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dottype-nuget-0.1.0
          path: artifacts/package/*
          if-no-files-found: error

      - name: Upload Windows and WinGet artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dottype-winget-0.1.0
          path: |
            artifacts/portable/release/*
            artifacts/winget/manifests/**/*
          if-no-files-found: error
