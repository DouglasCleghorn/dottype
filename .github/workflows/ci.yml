name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore locked dependencies
        run: dotnet restore dottype.slnx --locked-mode

      - name: Build
        run: dotnet build dottype.slnx -c Release --no-restore

      - name: Test
        run: dotnet test --project tests/dottype.tests/dottype.tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Pack NuGet tool
        if: runner.os == 'Linux'
        run: dotnet pack src/dottype/dottype.csproj -c Release --no-build --no-restore -p:RuntimeIdentifiers= -o artifacts/package

      - name: Test build integration and editor generator
        run: dotnet test --project tests/dottype.Build.tests/dottype.Build.tests.csproj -c Release --no-build --no-restore --minimum-expected-tests 1

      - name: Pack build integration
        run: dotnet pack src/dottype.Build/dottype.Build.csproj -c Release --no-build --no-restore -o artifacts/package

      - name: Verify build integration package
        shell: pwsh
        run: ./eng/verify-build-package.ps1

      - name: Verify Visual Studio project integration
        shell: pwsh
        run: ./eng/verify-visual-studio.ps1

      - name: Verify NuGet package
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./eng/verify-package.ps1

      - name: Smoke test CLI
        shell: pwsh
        run: ./eng/smoke-test.ps1 -Executable dotnet -PrefixArguments @('exec', 'src/dottype/bin/Release/net10.0/dottype.dll')

      - name: Publish Windows portable executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/publish-portables.ps1

      - name: Smoke test portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./eng/smoke-test.ps1 -Executable artifacts/portable/release/dottype-win-x64.exe

      - name: Upload NuGet packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dottype-nuget-0.2.0
          path: artifacts/package/*
          if-no-files-found: error

      - name: Upload Windows portable artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dottype-windows-0.2.0
          path: artifacts/portable/release/*
          if-no-files-found: error
